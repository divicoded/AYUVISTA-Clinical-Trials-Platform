version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiia-nexus-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=AYUVISTA
      - VERSION=1.0.0
      - SECRET_KEY=nexus-aiia-secret-key-2026-production-ready
      - DATABASE_URL=sqlite:///./aiia_nexus.db
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - aiia-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aiia-nexus-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aiia-network

networks:
  aiia-network:
    driver: bridge

volumes:
  backend-data:
